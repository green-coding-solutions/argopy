name: CI tests
# CI tests ran every time new code is pushed to the repo

on:
  schedule:
    - cron: "10 * * * *" # every hour at 10 minutes
  workflow_dispatch: # allows you to trigger the workflow run manually


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  id-token: write
  contents: read

jobs:

  core-pinned:
    # CI tests for environments with core requirements in pinned versions
    # All commits must pass this

    name: Core - Pinned - Py${{matrix.python-version}} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    continue-on-error: ${{ matrix.experimental }}
#    timeout-minutes: 45
    strategy:
      max-parallel: 12
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
        os: ["ubuntu-latest"]
        experimental: [false]

    steps:
      - name: Dump ECO-CI CPU Step before
        run: |
          cat /tmp/eco-ci/cpu-util-step.txt
        continue-on-error: true

      - name: Dump ECO-CI CPU before
        run: |
          cat /tmp/eco-ci/cpu-util-total.txt
        continue-on-error: true

      - name: Dump ECO-CI CPU Step actual processed
        run: |
          cat /tmp/eco-ci/cpu-util-temp.txt
        continue-on-error: true

      - name: Dump ECO-CI Energy Step actual processed
        run: |
          cat /tmp/eco-ci/energy-step.txt
        continue-on-error: true
      - name: Energy Estimation - Initialize
        if: ${{matrix.os == 'ubuntu-latest'}}
        uses: green-coding-solutions/eco-ci-energy-estimation@v4debug
        with:
          task: start-measurement
          tags: "${{github.workflow}},core-pinned,OS-${{matrix.os}},Company-,Py-${{matrix.python-version}}"
          electricitymaps-api-token: ${{ secrets.ELECTRICITYMAPS_TOKEN }}
          send-data: true
        continue-on-error: true
      - uses: actions/checkout@v4
      - name: Set environment variables
        run: |
          echo "CONDA_ENV_FILE=ci/requirements/py${{matrix.python-version}}-core-pinned.yml" >> $GITHUB_ENV
          echo "PYTHON_VERSION=${{ matrix.python-version }}" >> $GITHUB_ENV
          echo "LOG_FILE=argopy-tests-Core-Pinned-Py${{matrix.python-version}}-${{matrix.os}}.log" >> $GITHUB_ENV

      - name: Setup Micromamba ${{ matrix.python-version }}
        uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: '1.5.10-0'
          environment-name: argopy-tests
          environment-file: ${{ env.CONDA_ENV_FILE }}
          init-shell: bash
          cache-environment: true
          cache-environment-key: "${{runner.os}}-${{runner.arch}}-py${{matrix.python-version}}-${{env.TODAY}}-${{hashFiles(env.CONDA_ENV_FILE)}}"
          create-args: >-
            python=${{matrix.python-version}}

      - name: Install argopy
        run: |
          python -m pip install --no-deps -e .

      - name: Version info
        run: |
          micromamba info
          micromamba list

      - name: Dump ECO-CI CPU Step before
        run: |
          cat /tmp/eco-ci/cpu-util-step.txt
        continue-on-error: true

      - name: Dump ECO-CI CPU before
        run: |
          cat /tmp/eco-ci/cpu-util-total.txt
        continue-on-error: true

      - name: Dump ECO-CI CPU Step actual processed
        run: |
          cat /tmp/eco-ci/cpu-util-temp.txt
        continue-on-error: true

      - name: Dump ECO-CI Energy Step actual processed
        run: |
          cat /tmp/eco-ci/energy-step.txt
        continue-on-error: true

      - name: Energy Estimation - Measure Tests Setup
        if: ${{matrix.os == 'ubuntu-latest'}}
        uses: green-coding-solutions/eco-ci-energy-estimation@v4debug
        with:
          task: get-measurement
          label: 'setup core-pinned'
        continue-on-error: true
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: |
          pytest -ra -v -s -c argopy/tests/pytest.ini --durations=10 --cov=./ --cov-config=.coveragerc --cov-report xml:cov.xml --cov-report term-missing --log-file=${{env.LOG_FILE}} --junitxml=junit.xml -o junit_family=legacy

      - name: Dump ECO-CI CPU Step before
        run: |
          cat /tmp/eco-ci/cpu-util-step.txt
        continue-on-error: true

      - name: Dump ECO-CI CPU before
        run: |
          cat /tmp/eco-ci/cpu-util-total.txt
        continue-on-error: true

      - name: Dump ECO-CI CPU Step actual processed
        run: |
          cat /tmp/eco-ci/cpu-util-temp.txt
        continue-on-error: true

      - name: Dump ECO-CI Energy Step actual processed
        run: |
          cat /tmp/eco-ci/energy-step.txt
        continue-on-error: true

      - name: Energy Estimation - Measure Tests Exec
        if: ${{matrix.os == 'ubuntu-latest'}}
        uses: green-coding-solutions/eco-ci-energy-estimation@v4debug
        with:
          task: get-measurement
          label: 'pytest core-pinned'
        continue-on-error: true

      - name: Dump ECO-CI CPU Step before
        run: |
          cat /tmp/eco-ci/cpu-util-step.txt
        continue-on-error: true

      - name: Dump ECO-CI CPU before
        run: |
          cat /tmp/eco-ci/cpu-util-total.txt
        continue-on-error: true

      - name: Dump ECO-CI CPU Step actual processed
        run: |
          cat /tmp/eco-ci/cpu-util-temp.txt
        continue-on-error: true

      - name: Dump ECO-CI Energy Step actual processed
        run: |
          cat /tmp/eco-ci/energy-step.txt
        continue-on-error: true

      - name: Energy Estimation - Show Results
        if: ${{matrix.os == 'ubuntu-latest'}}
        uses: green-coding-solutions/eco-ci-energy-estimation@v4debug
        with:
          task: display-results
        continue-on-error: true

